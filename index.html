<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom Platformer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; color: #fff; font-size: 22px; font-weight: 800;
      text-shadow: 2px 2px 0 #3a2a6b, -1px -1px 0 #3a2a6b; pointer-events: none;
    }
    #help {
      position: fixed; bottom: 14px; left: 16px; color: #fff; font-size: 14px;
      text-shadow: 1px 1px 0 #3a2a6b; pointer-events: none; opacity: 0.9;
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px; font-weight: 800; text-shadow: 2px 2px 0 #3a2a6b;
    }
    #banner {
      position: fixed; top: 35%; width: 100%; text-align: center; color: #ffd84a; font-size: 56px;
      font-weight: 900; text-shadow: 3px 3px 0 #7a2a10; pointer-events: none; display: none;
    }
    #minimap {
      position: fixed; top: 14px; right: 14px; border: 4px solid #fff; border-radius: 50%;
      box-shadow: 0 0 0 3px #3a2a6b; pointer-events: none;
    }
    #hud .small { font-size: 17px; }
    #hud .bar { width: 220px; height: 9px; margin-top: 5px; background: rgba(0,0,0,0.35); border-radius: 5px; overflow: hidden; }
    #hud .bar div { height: 100%; background: linear-gradient(90deg, #8fd46a, #ffd84a, #ff8a6a); }
    #help2 { margin-top: 4px; font-weight: 700; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.45s; }
    #loading { z-index: 2; }
    #gear {
      position: fixed; top: 222px; right: 22px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff;
      background: rgba(30,20,40,0.55); color: #fff; font-size: 20px; cursor: pointer;
    }
    #talk { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); padding: 8px 16px; border-radius: 20px;
      background: rgba(20, 14, 10, 0.72); color: #fff; font: 700 17px system-ui, sans-serif; display: none; pointer-events: none;
      border: 2px solid #d9a441; }
    #dialog { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); width: min(760px, 88vw); min-height: 96px;
      padding: 16px 22px 26px; border-radius: 14px; background: rgba(24, 16, 12, 0.88); border: 3px solid #d9a441; color: #fff8ec;
      font: 500 20px/1.45 system-ui, sans-serif; display: none; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    #dialog .who { color: #ffd27a; font-weight: 800; font-size: 17px; margin-bottom: 6px; letter-spacing: 0.5px; }
    #dialog .next { position: absolute; right: 16px; bottom: 6px; font-size: 13px; opacity: 0.75; }
    #np { position: fixed; right: 22px; bottom: 64px; color: #fff3d8; font: italic 600 16px system-ui, sans-serif; text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
    #settings {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 3;
      background: rgba(20,14,26,0.88); color: #fff; padding: 22px 26px; border-radius: 14px; text-align: center; min-width: 320px;
    }
    #settings.open { display: block; }
    #settings .title { font-size: 22px; font-weight: 800; margin-bottom: 14px; }
    #settings button { margin: 4px; padding: 10px 16px; font-size: 16px; border-radius: 8px; border: 2px solid #8a7aa8; background: #2c2238; color: #fff; cursor: pointer; }
    #settings button.focus { outline: 3px solid #7fd4ff; outline-offset: 2px; }
    #settings button.on { background: #d9a441; border-color: #fff; color: #201810; font-weight: 800; }
    #settings .note { margin-top: 12px; font-size: 13px; opacity: 0.8; }
    #fps { margin-top: 8px; font-size: 14px; font-weight: 700; }
    #toast {
      position: fixed; top: 22%; width: 100%; text-align: center; color: #fff; font-size: 28px; font-weight: 800;
      text-shadow: 2px 2px 0 #3a2a6b; pointer-events: none; opacity: 0; transition: opacity 0.4s;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="hud"></div>
  <canvas id="minimap"></canvas>
  <div id="toast"></div>
  <div id="help"><span id="helpKeys">WASD / Arrows: move &nbsp;·&nbsp; Space: jump &nbsp;·&nbsp; Shift: walk &nbsp;·&nbsp; J or Click: sword (press again for a 3-hit combo) &nbsp;·&nbsp; K or Right-click: block &nbsp;·&nbsp; L: kick &nbsp;·&nbsp; Drag mouse: camera &nbsp;·&nbsp; Mouse wheel: zoom &nbsp;·&nbsp; E: talk &nbsp;·&nbsp; M: music &nbsp;·&nbsp; O: graphics</span><div id="help2"></div></div>
  <div id="banner"></div>
  <div id="talk"></div>
  <div id="np"></div>
  <div id="dialog"><div class="who"></div><div class="text"></div><div class="next"></div></div>
  <div id="fade"></div>
  <button id="gear" title="Graphics settings (O)">⚙</button>
  <div id="settings"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
